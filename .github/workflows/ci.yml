name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check code quality
        run: ruff check .

      - name: Check code formatting
        run: ruff format --check .

      - name: Run tests
        run: python -m pytest -q

  docker:
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build local-only API image
        run: docker build --tag governed-ap-assessment:ci .

      - name: Verify Tesseract installation
        run: docker run --rm --entrypoint tesseract governed-ap-assessment:ci --list-langs

      - name: Configure temporary API key
        shell: bash
        run: |
          key="$(openssl rand -hex 32)"
          echo "::add-mask::$key"
          echo "GOVERNED_AP_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Start local-only API container
        run: |
          docker run --detach \
            --name ap-ci-smoke \
            --publish 127.0.0.1:8000:8000 \
            --env GOVERNED_AP_API_KEY \
            governed-ap-assessment:ci

      - name: Check local health endpoint
        shell: bash
        run: |
          for attempt in {1..20}; do
            echo "Checking API readiness: attempt $attempt/20"

            if curl --fail --silent --show-error --max-time 3 \
              --noproxy '*' http://127.0.0.1:8000/health; then
              echo "API health check passed."
              exit 0
            fi

            if [ "$(docker inspect --format='{{.State.Running}}' ap-ci-smoke)" != "true" ]; then
              echo "ERROR: API container stopped unexpectedly."
              docker logs ap-ci-smoke || true
              exit 1
            fi

            echo "API is not ready yet."
            sleep 2
          done

          echo "ERROR: API did not become ready."
          docker ps --all
          docker logs ap-ci-smoke || true
          exit 1

      - name: Verify API authentication and fail-closed assessment
        shell: bash
        run: |
          printf '%s\n' '%PDF-1.4' 'invalid test document' \
            > "$RUNNER_TEMP/invalid-invoice.pdf"

          unauthenticated_status="$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --form "file=@${RUNNER_TEMP}/invalid-invoice.pdf;type=application/pdf" \
            http://127.0.0.1:8000/v1/invoices/assess)"

          echo "Unauthenticated HTTP status: $unauthenticated_status"
          test "$unauthenticated_status" = "401"

          curl --fail --silent --show-error \
            --header "X-API-Key: ${GOVERNED_AP_API_KEY}" \
            --form "file=@${RUNNER_TEMP}/invalid-invoice.pdf;type=application/pdf" \
            http://127.0.0.1:8000/v1/invoices/assess \
            > "$RUNNER_TEMP/assessment.json"

          python3 - "$RUNNER_TEMP/assessment.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert result["action"] == "ESCALATE"
          assert result["human_review_required"] is True
          assert result["payment_executed"] is False
          assert result["governance_agent_invoked"] is False
          assert result["source"] == "ERROR"
          print("Authenticated fail-closed assessment passed.")
          PY

      - name: Verify real Tesseract OCR on fictional scanned PDF
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --header "X-API-Key: ${GOVERNED_AP_API_KEY}" \
            --form "file=@tests/fixtures/ci_fictional_scanned_invoice.pdf;type=application/pdf" \
            http://127.0.0.1:8000/v1/invoices/assess \
            > "$RUNNER_TEMP/ocr-assessment.json"

          python3 - "$RUNNER_TEMP/ocr-assessment.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert result["source"] == "OCR", "Expected image-only PDF OCR"
          assert result["extracted"]["invoice_number"] == "TEST-2026-001"
          assert result["extracted"]["currency"] == "AED"
          assert result["extracted"]["total"] == "63.00"
          assert result["action"] == "ESCALATE"
          assert result["human_review_required"] is True
          assert result["payment_executed"] is False
          assert result["governance_agent_invoked"] is False
          print("Real Tesseract OCR and review-only assessment passed.")
          PY

      - name: Show container logs on failure
        if: failure()
        run: |
          docker ps --all
          docker logs ap-ci-smoke || true

      - name: Stop smoke-test container
        if: always()
        run: docker rm --force ap-ci-smoke || true
